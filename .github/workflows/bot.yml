name: Selenium Bot

on:
  workflow_dispatch:
    inputs:
      dosya_yolu:
        description: 'Kontrol edilecek dosyanın adı'
        required: true
        default: 'combo.txt'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Chrome ve Kütüphaneleri Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          pip install selenium webdriver-manager

      - name: Botu Çalıştır
        env:
          GIRILEN_DOSYA: ${{ github.event.inputs.dosya_yolu }}
        run: python main.py

      - name: Ekran Görüntüsünü Kaydet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-ekran-goruntusu
          path: ekran.png
